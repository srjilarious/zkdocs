name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.1857+3c46da14d

      - name: Build zkdocs
        run: zig build

      - name: Run unit tests
        run: zig build tests

      - name: Build documentation
        run: zig build docs
